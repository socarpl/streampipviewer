name: Build and release Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Publish in sequence and keep queued pushes instead of cancelling older builds.
concurrency:
  group: windows-release
  queue: max

jobs:
  build-windows:
    name: Build and release Windows
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test release publishing and retention
        run: node tests/release.test.cjs

      - name: Test logging and shared disk retention
        run: dotnet run --project tests/LoggingRegression --configuration Release

      - name: Resolve version
        run: |
          $version = dotnet msbuild CctvPip.App.csproj -nologo -target:GetAssemblyVersion -getProperty:Version
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the application version." }
          $version = ($version | Out-String).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: |
          dotnet restore CctvPip.App.csproj
          if ($LASTEXITCODE -ne 0) { throw "App restore failed." }
          dotnet restore CctvPip.StreamHost/CctvPip.StreamHost.csproj
          if ($LASTEXITCODE -ne 0) { throw "Stream host restore failed." }

      - name: Build release output
        run: dotnet build CctvPip.App.csproj --configuration Release --no-restore --nologo

      - name: Verify app and stream host versions
        run: |
          $output = Join-Path $PWD "bin/Release/net8.0-windows"
          foreach ($relativePath in @("StreamPipViewer.dll", "StreamHost/CctvPip.StreamHost.dll")) {
              $path = Join-Path $output $relativePath
              $actual = [Diagnostics.FileVersionInfo]::GetVersionInfo($path).FileVersion
              if ($actual -ne $env:APP_VERSION) { throw "$relativePath has version $actual; expected $env:APP_VERSION" }
          }

      - name: Package release ZIP
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $PWD "bin/Release/net8.0-windows"
          if (-not (Test-Path -LiteralPath $output)) { throw "Release output folder was not created." }
          $privateConfigs = Get-ChildItem -LiteralPath $output -Recurse -File |
              Where-Object { $_.Name -in @("stream-pip.config", "cctv-pip.properties") }
          if ($privateConfigs) { throw "Private camera configuration must not be packaged." }
          $zipName = "StreamPIPViewer-v$env:APP_VERSION-windows.zip"
          Compress-Archive -Path (Join-Path $output "*") -DestinationPath $zipName -CompressionLevel Optimal -Force
          "ZIP_PATH=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish release and keep latest plus two previous releases
        uses: actions/github-script@v8
        with:
          script: |
            const publish = require('./.github/scripts/release.cjs');
            await publish({ github, context, core });
